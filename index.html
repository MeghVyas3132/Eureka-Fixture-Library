<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eureka Fixture Studio</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #ffffff; --ink: #1d2027; --muted: #6b7280; --line: #e6e3dd;
    --brand: #e8622c; --brand-soft: #fdeee6; --sel: #2563eb; --sel-soft: #e8efff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 Inter, -apple-system, Helvetica, Arial, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 300px 1fr 340px; grid-template-rows: 56px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--brand), #f59e0b); display: inline-block; }
  .tabs { display: flex; background: #f1efeb; border-radius: 10px; padding: 3px; margin-left: 12px; }
  .tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tabs .sep { width: 1px; background: #dcd8d1; margin: 4px 4px; }
  header select, header .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  header .sp { flex: 1; }
  aside { background: var(--panel); overflow: auto; }
  aside.left { border-right: 1px solid var(--line); padding: 12px; }
  aside.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #search { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #faf9f7; }
  #count { color: var(--muted); font-size: 11px; margin: 6px 2px 4px; }
  #catalog h4 { margin: 14px 2px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .item { position: relative; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .item:hover { border-color: #cfc9bf; }
  .item.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .item span { font-size: 11px; font-weight: 600; line-height: 1.2; }
  .item i { position: absolute; top: 4px; right: 6px; color: #f59e0b; font-style: normal; font-size: 11px; }
  .thumb { height: 74px; background: linear-gradient(#faf9f7, #f1efeb); border-radius: 6px; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .thumb svg { max-width: 100%; max-height: 100%; }
  main { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #fbfaf8, #ebe8e2); }
  #v2d, #v3d { position: absolute; inset: 0; }
  #v2d svg { width: 100%; height: 100%; display: block; padding: 28px 28px 60px; box-sizing: border-box; }
  #v2d .drag { cursor: ns-resize; }
  .hud { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; pointer-events: none; }
  #metrics, #hint { background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 12px; backdrop-filter: blur(6px); }
  #metrics .dot { color: #c9c3b8; margin: 0 7px; }
  #hint { color: var(--muted); max-width: 40%; }
  .phead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #ptitle { font-weight: 800; font-size: 15px; }
  #pfamily { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .pbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pbtns button { border: 1px solid var(--line); background: #faf9f7; border-radius: 7px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
  #form { flex: 1; overflow: auto; padding: 6px 12px 16px; }
  .fields { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 104px 1fr auto auto; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px dashed #efece7; }
  .row > span { color: #3b3f47; font-size: 12px; }
  .row input[type=range] { width: 100%; accent-color: var(--brand); }
  .row input[type=number] { width: 62px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; background: #faf9f7; }
  .row input[type=text], .row select { grid-column: 2 / -1; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: #faf9f7; }
  .row em { font-style: normal; color: var(--muted); font-size: 11px; width: 18px; }
  .seg { grid-column: 2 / -1; display: flex; background: #f1efeb; border-radius: 7px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 5px; padding: 3px 4px; cursor: pointer; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .step { grid-column: 2 / -1; display: flex; gap: 4px; }
  .step button { width: 26px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; }
  .tog { grid-column: 2; justify-self: start; width: 34px; height: 20px; appearance: none; background: #d8d4cd; border-radius: 10px; position: relative; cursor: pointer; transition: .15s; }
  .tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .tog:checked { background: var(--brand); } .tog:checked::after { left: 16px; }
  .list { margin: 10px 0 4px; border: 1px solid var(--line); border-radius: 10px; background: #fcfbfa; }
  .lhead { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .lhead b { font-size: 12px; } .lhead span { color: var(--muted); font-size: 11px; background: #f1efeb; border-radius: 10px; padding: 0 7px; }
  .lhead button { margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 11px; }
  .lhead button + button { margin-left: 0; }
  .lhead .add { color: var(--brand); font-weight: 700; border-color: #f6c7b1; background: var(--brand-soft); }
  details { border-bottom: 1px solid #f0ede8; } details:last-child { border-bottom: 0; }
  details.sel > summary { background: var(--sel-soft); color: var(--sel); }
  summary { cursor: pointer; padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; list-style: none; }
  summary::before { content: "▸"; color: var(--muted); font-size: 10px; } details[open] > summary::before { content: "▾"; }
  summary span:first-child { flex: 1; }
  .tools { display: flex; gap: 3px; opacity: .55; } summary:hover .tools { opacity: 1; }
  .tools button { border: 0; background: transparent; cursor: pointer; padding: 0 3px; }
  details > .fields { padding: 2px 8px 8px 14px; }
  details .list { margin-left: 0; }
  .jsonbox { border-top: 1px solid var(--line); max-height: 28%; display: flex; flex-direction: column; }
  .jsonbox summary { padding: 8px 14px; }
  #json { margin: 0; padding: 8px 14px; overflow: auto; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #475569; background: #faf9f7; outline: none; flex: 1; }
  body.sheet { background: #f4f3f0; padding: 18px; height: auto; }
  .sgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .sgrid figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .sgrid svg, .sgrid img { width: 100%; height: 190px; object-fit: contain; display: block; }
  .sgrid figcaption { font-size: 11px; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>Eureka Fixture Studio</div>
    <div class="tabs">
      <button data-view="front">2D Front</button><button data-view="top">2D Top</button><button data-view="side">2D Side</button>
      <span class="sep"></span><button data-view="iso">2.5D</button><button data-view="3d">3D</button>
    </div>
    <div class="sp"></div>
    <select id="dress"></select>
    <select id="theme"></select>
    <button class="btn" id="fit">Fit</button>
  </header>
  <aside class="left">
    <input id="search" placeholder="Search fixtures, verticals…" />
    <div id="count"></div>
    <div id="catalog"></div>
  </aside>
  <main>
    <div id="v2d"></div>
    <div id="v3d"></div>
    <div class="hud"><div id="metrics"></div><div id="hint">Click a part to edit it · drag shelves, rails, arms in 2D Front (they snap to slot pitch) · orbit in 3D</div></div>
  </main>
  <aside class="right">
    <div class="phead">
      <div id="pfamily"></div><div id="ptitle"></div>
      <div class="pbtns"><button id="reset">Reset preset</button><button id="exp-svg">Export SVG</button><button id="exp-png">Export PNG</button><button id="exp-json">Export JSON</button></div>
    </div>
    <div id="form"></div>
    <details class="jsonbox"><summary>Spec JSON (editable) <button id="apply-json" style="margin-left:auto">Apply</button></summary><pre id="json" contenteditable="true" spellcheck="false"></pre></details>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
